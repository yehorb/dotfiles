# Keep Bluetooth USB devices from runtime-suspending when idle.
# On this laptop's MediaTek MT7921 a failed autosuspend wake-up hung the
# Bluetooth chip so badly that it survived power-off; only an ASUS EC reset
# brought it back. Details: /usr/share/doc/btusb-autosuspend-cfg/README.md
options btusb enable_autosuspend=0
